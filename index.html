<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KiwinatorKart</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
    }

    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── MAIN MENU ── */
    #main-menu {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #0a0a0f 0%, #1a0a2e 60%, #0d1f0d 100%);
      z-index: 10;
    }

    #main-menu h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 900;
      letter-spacing: -2px;
      background: linear-gradient(90deg, #ffe94d, #ff6b35, #ff3864);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.2em;
      text-shadow: none;
    }

    #main-menu .subtitle {
      color: #888;
      font-size: 0.95rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 3rem;
    }

    .menu-btn {
      background: none;
      border: 2px solid #ffe94d44;
      color: #ffe94d;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0.8em 2.5em;
      margin: 0.4em;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      min-width: 220px;
    }

    .menu-btn:hover {
      background: #ffe94d18;
      border-color: #ffe94d;
      transform: scale(1.03);
    }

    .menu-btn.primary {
      background: #ffe94d;
      color: #0a0a0f;
      border-color: #ffe94d;
    }

    .menu-btn.primary:hover {
      background: #ffd700;
      transform: scale(1.05);
    }

    /* ── CHARACTER SELECT ── */
    #char-select {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      z-index: 10;
    }

    #char-select h2 {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffe94d;
      margin-bottom: 2rem;
      text-transform: uppercase;
    }

    #char-grid {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .char-card {
      background: #ffffff0a;
      border: 2px solid #ffffff15;
      border-radius: 8px;
      padding: 1.5rem 2rem;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      min-width: 140px;
    }

    .char-card:hover, .char-card.selected {
      border-color: #ffe94d;
      background: #ffe94d12;
      transform: translateY(-4px);
    }

    .char-card img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      image-rendering: pixelated;
      margin-bottom: 0.8rem;
    }

    .char-card .char-name {
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
      color: #fff;
    }

    .char-card .char-stat {
      font-size: 0.75rem;
      color: #888;
      margin-top: 0.3em;
    }

    /* ── HUD ── */
    #hud {
      position: fixed;
      inset: 0;
      display: none;
      pointer-events: none;
      z-index: 5;
    }

    #hud-top {
      position: absolute;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .hud-pill {
      background: #000000aa;
      border: 1px solid #ffffff22;
      border-radius: 999px;
      padding: 0.4em 1.2em;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffe94d;
    }

    #hud-lap { font-size: 1rem; }

    #speedometer {
      position: absolute;
      bottom: 1.5rem;
      right: 1.5rem;
      background: #000000bb;
      border: 1px solid #ffffff22;
      border-radius: 8px;
      padding: 0.6em 1.2em;
      font-size: 1.4rem;
      font-weight: 900;
      color: #ffe94d;
      letter-spacing: 1px;
    }

    #speedometer span {
      font-size: 0.7rem;
      color: #888;
      font-weight: 400;
    }

    #weapon-slot {
      position: absolute;
      bottom: 1.5rem;
      left: 1.5rem;
      background: #000000bb;
      border: 2px solid #ffffff22;
      border-radius: 8px;
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }

    #position-display {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-size: 2.5rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 20px #ffe94d88;
    }

    #position-display sup {
      font-size: 1rem;
      color: #ffe94d;
    }

    /* ── LOADING ── */
    #loading {
      position: fixed;
      inset: 0;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    #loading-bar-wrap {
      width: 280px;
      height: 4px;
      background: #ffffff15;
      border-radius: 2px;
      margin-top: 1.5rem;
      overflow: hidden;
    }

    #loading-bar {
      height: 100%;
      background: linear-gradient(90deg, #ffe94d, #ff6b35);
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s ease;
    }

    #loading p {
      color: #888;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <!-- THREE.JS CANVAS -->
  <div id="canvas-container">
    <canvas id="game-canvas"></canvas>
  </div>

  <!-- LOADING SCREEN -->
  <div id="loading">
    <h1 style="font-size:2rem;font-weight:900;color:#ffe94d;letter-spacing:2px;">KIWINATOR KART</h1>
    <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
    <p id="loading-text">Laden...</p>
  </div>

  <!-- MAIN MENU -->
  <div id="main-menu" style="display:none;">
    <h1>KiwinatorKart</h1>
    <p class="subtitle">Start je motoren</p>
    <button class="menu-btn primary" onclick="showCharSelect()">Spelen</button>
    <button class="menu-btn" onclick="showOptions()">Opties</button>
  </div>

  <!-- CHARACTER SELECT -->
  <div id="char-select">
    <h2>Kies je coureur</h2>
    <div id="char-grid">
      <!-- Wordt gevuld door characters.js -->
    </div>
    <button class="menu-btn primary" onclick="startRace()">Race starten!</button>
    <button class="menu-btn" onclick="showMenu()" style="font-size:0.85rem;padding:0.5em 1.5em;">← Terug</button>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div id="hud-top">
      <div class="hud-pill" id="hud-lap">Ronde 1 / 3</div>
      <div class="hud-pill" id="hud-time">0:00</div>
    </div>
    <div id="position-display">1<sup>ste</sup></div>
    <div id="speedometer">0 <span>km/h</span></div>
    <div id="weapon-slot">—</div>
  </div>

  <!-- THREE.JS CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <!-- GAME SCRIPTS (volgorde belangrijk!) -->
  <script src="js/characters.js"></script>
  <script src="js/track.js"></script>
  <script src="js/kart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
